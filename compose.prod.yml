name: Bill-App-Production
services:
  # PostgreSQL 資料庫服務
  db:
    image: postgres:18.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file: './.env'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_vol:/var/lib/postgresql
    networks:
      - bill-app-network
  # Redis
  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "6379:6379"
    volumes:
      - redis_vol:/data
    command: redis-server --appendonly yes
    networks:
      - bill-app-network
  # API
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      REDIS_CONNECTION: redis:6379
      DB_HOST: db
    networks:
      - bill-app-network
networks:
  bill-app-network:
    driver: bridge
volumes:
  postgres_vol:
    external: true
    name: bill-app_postgres_vol
  redis_vol:
    external: true
    name: bill-app_redis_vol
